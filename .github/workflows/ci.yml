name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      - name: Install the Bitrise CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download -R bitrise-io/bitrise --pattern 'bitrise-Linux-x86_64' -O "$HOME/.local/bin/bitrise"
          chmod +x "$HOME/.local/bin/bitrise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: shellcheck
        run: shellcheck step.sh lib/*.sh test/helpers/stubs/*
      - name: Audit the step
        run: bitrise run audit-this-step
      - name: Unit tests
        run: bats test/unit
