format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  # Runs the step from this checkout against a local MinIO: save, restore and save again
  # for gradle-deps, with a fabricated Gradle home in a temporary directory (HOME is
  # switched to it after the first step) so that the real ~/.gradle is never touched.
  test:
    steps:
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Start MinIO and fabricate a Gradle home
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            minio_env="$(e2e/scripts/start-minio.sh)"
            eval "${minio_env}"
            envman add --key S3_CACHE_ENDPOINT --value "${S3_CACHE_ENDPOINT}"
            envman add --key S3_CACHE_BUCKET --value "${S3_CACHE_BUCKET}"
            envman add --key S3_CACHE_ACCESS_KEY_ID --value "${S3_CACHE_ACCESS_KEY_ID}"
            envman add --key S3_CACHE_SECRET_ACCESS_KEY --value "${S3_CACHE_SECRET_ACCESS_KEY}"
            envman add --key S3_CACHE_PREFIX --value "step-test"
            envman add --key S3_CACHE_REGION --value "us-east-1"

            work="$(mktemp -d "${TMPDIR:-/tmp}/s3-cache-step-test.XXXXXX")"
            mkdir -p "${work}/home/.gradle/caches/modules-2" "${work}/src"
            echo "dependency" > "${work}/home/.gradle/caches/modules-2/x"
            echo "org.gradle.jvmargs=-Xmx1g" > "${work}/src/gradle.properties"
            envman add --key S3_TEST_DIR --value "${work}"
            envman add --key S3_TEST_HOME --value "${work}/home"
            # From here on every step sees the temporary directory as its home, so the real
            # ~/.gradle of this machine is never read or written. (Bitrise has no per-step envs.)
            envman add --key HOME --value "${work}/home"
            envman add --key S3_TEST_SRC --value "${work}/src"
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check that the temporary home is in effect
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            [ -n "${S3_TEST_HOME}" ] || { echo "S3_TEST_HOME is empty"; exit 1; }
            [ "${HOME}" = "${S3_TEST_HOME}" ] || { echo "HOME is '${HOME}', expected the temporary home '${S3_TEST_HOME}'"; exit 1; }
    - path::./:
        title: Save the Gradle dependencies
        inputs:
        - mode: save
        - caches: gradle-deps
        - gradle_key_files: $S3_TEST_SRC/gradle.properties
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check the first save and remove the Gradle home
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            [ "${S3_CACHE_SAVE_GRADLE_DEPS}" = uploaded ] || { echo "expected uploaded, got '${S3_CACHE_SAVE_GRADLE_DEPS}'"; exit 1; }
            # The archive of the fabricated home is a few hundred bytes. A large one means that the
            # step saw a real home directory.
            size="$(AWS_ACCESS_KEY_ID="${S3_CACHE_ACCESS_KEY_ID}" AWS_SECRET_ACCESS_KEY="${S3_CACHE_SECRET_ACCESS_KEY}" AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url "${S3_CACHE_ENDPOINT}" s3api list-objects-v2 --bucket "${S3_CACHE_BUCKET}" \
              --prefix "${S3_CACHE_PREFIX}/" --query 'Contents[0].Size' --output text)"
            case "${size}" in "" | None | *[!0-9]*) echo "cannot read the archive size: '${size}'"; exit 1 ;; esac
            [ "${size}" -le 1048576 ] || { echo "the archive is ${size} bytes, the step did not see the temporary home"; exit 1; }
            [ -n "${S3_TEST_HOME}" ] || exit 1
            [ -d "${S3_TEST_HOME}/.gradle" ] || exit 1
            [ "${HOME}" = "${S3_TEST_HOME}" ] || exit 1
            rm -rf "${S3_TEST_HOME}/.gradle"
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check that the temporary home is still in effect
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            [ -n "${S3_TEST_HOME}" ] || { echo "S3_TEST_HOME is empty"; exit 1; }
            [ "${HOME}" = "${S3_TEST_HOME}" ] || { echo "HOME is '${HOME}', expected the temporary home '${S3_TEST_HOME}'"; exit 1; }
    - path::./:
        title: Restore the Gradle dependencies
        inputs:
        - mode: restore
        - caches: gradle-deps
        - gradle_key_files: $S3_TEST_SRC/gradle.properties
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check the restore
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            [ "${S3_CACHE_RESULT_GRADLE_DEPS}" = exact ] || { echo "expected exact, got '${S3_CACHE_RESULT_GRADLE_DEPS}'"; exit 1; }
            [ "$(cat "${S3_TEST_HOME}/.gradle/caches/modules-2/x")" = dependency ]
    - path::./:
        title: Save the Gradle dependencies again
        inputs:
        - mode: save
        - caches: gradle-deps
        - gradle_key_files: $S3_TEST_SRC/gradle.properties
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check the second save
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail
            [ "${S3_CACHE_SAVE_GRADLE_DEPS}" = refreshed ] || { echo "expected refreshed, got '${S3_CACHE_SAVE_GRADLE_DEPS}'"; exit 1; }
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Stop MinIO and clean up
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            rc=0
            e2e/scripts/stop-minio.sh || rc=$?
            if [ -n "${S3_TEST_DIR}" ]; then rm -rf "${S3_TEST_DIR}"; fi
            exit "${rc}"

  # End-to-end tests: build the sample app in e2e/sample-app twice with the step around each
  # build and check that the second round used the caches. They run on GitHub Actions, in
  # e2e/docker (Android) and on Bitrise. The caches live in the real home directory, so the
  # workflows refuse to run unless CI=true (see e2e/scripts/clean-local.sh).
  e2e-android:
    summary: Android end-to-end test against a MinIO started for the run.
    envs:
    - E2E_PLATFORM: android
    - E2E_CACHES: |-
        gradle-deps
        gradle-build-cache
        ccache
    before_run:
    - _e2e-start-minio
    after_run:
    - _e2e-rounds

  e2e-ios:
    summary: iOS end-to-end test (CocoaPods) against a MinIO started for the run.
    envs:
    - E2E_PLATFORM: ios
    - E2E_CACHES: cocoapods
    before_run:
    - _e2e-start-minio
    after_run:
    - _e2e-rounds

  e2e-external-bucket:
    summary: Android end-to-end test against the bucket in the S3_CACHE_* secrets; skipped without them.
    envs:
    - E2E_PLATFORM: android
    - E2E_CACHES: |-
        gradle-deps
        gradle-build-cache
        ccache
    steps:
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Use the external bucket
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            if [ -z "${S3_CACHE_BUCKET:-}" ] || [ -z "${S3_CACHE_ACCESS_KEY_ID:-}" ] || [ -z "${S3_CACHE_SECRET_ACCESS_KEY:-}" ]; then
              echo "skipped: no S3_CACHE_* secrets (S3_CACHE_BUCKET, S3_CACHE_ACCESS_KEY_ID, S3_CACHE_SECRET_ACCESS_KEY)"
              envman add --key E2E_SKIP --value true
              exit 0
            fi
            e2e/scripts/clean-local.sh --check
            prefix="${S3_CACHE_PREFIX:+${S3_CACHE_PREFIX%/}/}e2e/${BITRISE_BUILD_NUMBER:-local}-${RANDOM}"
            envman add --key S3_CACHE_PREFIX --value "${prefix}"
            envman add --key E2E_LOG_DIR --value "${E2E_LOG_DIR:-${BITRISE_DEPLOY_DIR}/e2e-logs}"
            echo "bucket ${S3_CACHE_BUCKET}, prefix ${prefix}, endpoint ${S3_CACHE_ENDPOINT:-AWS S3}"
    after_run:
    - _e2e-rounds

  _e2e-start-minio:
    summary: Checks that the machine may be wiped, starts MinIO and selects a unique prefix.
    steps:
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Start MinIO
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            e2e/scripts/clean-local.sh --check
            minio_env="$(e2e/scripts/start-minio.sh)"
            eval "${minio_env}"
            envman add --key S3_CACHE_ENDPOINT --value "${S3_CACHE_ENDPOINT}"
            envman add --key S3_CACHE_BUCKET --value "${S3_CACHE_BUCKET}"
            envman add --key S3_CACHE_ACCESS_KEY_ID --value "${S3_CACHE_ACCESS_KEY_ID}"
            envman add --key S3_CACHE_SECRET_ACCESS_KEY --value "${S3_CACHE_SECRET_ACCESS_KEY}"
            envman add --key S3_CACHE_REGION --value "us-east-1"
            envman add --key S3_CACHE_PREFIX --value "e2e/${BITRISE_BUILD_NUMBER:-local}-${RANDOM}"
            envman add --key E2E_LOG_DIR --value "${E2E_LOG_DIR:-${BITRISE_DEPLOY_DIR}/e2e-logs}"

  # Round 1: restore, build, save. Then clean-local.sh. Round 2: restore, build, save, check.
  # Uses E2E_PLATFORM (android or ios) and E2E_CACHES; does nothing when E2E_SKIP is true.
  _e2e-rounds:
    steps:
    - path::./:
        title: Restore the caches (round 1)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - mode: restore
        - caches: $E2E_CACHES
        - gradle_key_files: |-
            e2e/sample-app/android/gradle.properties
            e2e/sample-app/android/build.gradle
            e2e/sample-app/android/app/build.gradle
            e2e/sample-app/package-lock.json
        - cocoapods_lockfile: e2e/sample-app/ios/Podfile.lock
        - cocoapods_dir: e2e/sample-app/ios/Pods
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Build the sample app (round 1)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "e2e/scripts/build-${E2E_PLATFORM}.sh" 1
    - path::./:
        title: Save the caches (round 1)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - mode: save
        - caches: $E2E_CACHES
        - gradle_key_files: |-
            e2e/sample-app/android/gradle.properties
            e2e/sample-app/android/build.gradle
            e2e/sample-app/android/app/build.gradle
            e2e/sample-app/package-lock.json
        - cocoapods_lockfile: e2e/sample-app/ios/Podfile.lock
        - cocoapods_dir: e2e/sample-app/ios/Pods
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Remove the local caches and build outputs
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            e2e/scripts/clean-local.sh
    - path::./:
        title: Restore the caches (round 2)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - mode: restore
        - caches: $E2E_CACHES
        - gradle_key_files: |-
            e2e/sample-app/android/gradle.properties
            e2e/sample-app/android/build.gradle
            e2e/sample-app/android/app/build.gradle
            e2e/sample-app/package-lock.json
        - cocoapods_lockfile: e2e/sample-app/ios/Podfile.lock
        - cocoapods_dir: e2e/sample-app/ios/Pods
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Build the sample app (round 2)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "e2e/scripts/build-${E2E_PLATFORM}.sh" 2
    - path::./:
        title: Save the caches (round 2)
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - mode: save
        - caches: $E2E_CACHES
        - gradle_key_files: |-
            e2e/sample-app/android/gradle.properties
            e2e/sample-app/android/build.gradle
            e2e/sample-app/android/app/build.gradle
            e2e/sample-app/package-lock.json
        - cocoapods_lockfile: e2e/sample-app/ios/Podfile.lock
        - cocoapods_dir: e2e/sample-app/ios/Pods
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Check round 2
        run_if: '{{not (enveq "E2E_SKIP" "true")}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            e2e/scripts/assert-round2.sh "${E2E_PLATFORM}"
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Stop MinIO
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -uo pipefail
            e2e/scripts/stop-minio.sh

  audit-this-step:
    steps:
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        title: Audit the step
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            stepman audit --step-yml ./step.yml

  # Publishing from the template: share the step with the Bitrise StepLib.
  share-this-step:
    envs:
    - MY_STEPLIB_REPO_FORK_GIT_URL: $MY_STEPLIB_REPO_FORK_GIT_URL
    - STEP_ID_IN_STEPLIB: s3-build-cache
    - STEP_GIT_VERION_TAG_TO_SHARE: $STEP_GIT_VERION_TAG_TO_SHARE
    - STEP_GIT_CLONE_URL: https://github.com/AppstersBP/bitrise-step-s3-build-cache.git
    description: |-
      If this is the first time you try to share a Step you should
      first call: $ bitrise share

      This will print you a guide, and information about how Step sharing
      works. Please read it at least once!

      As noted in the Step sharing guide you'll have to fork the
      StepLib you want to share this step into. Once you're done with forking
      the repository you should set your own fork's git clone URL
      in the `.bitrise.secrets.yml` file, or here in the `envs` section,
      as the value of the `MY_STEPLIB_REPO_FORK_GIT_URL` environment.

      You're now ready to share this Step, just make sure that
      the `STEP_ID_IN_STEPLIB` and `STEP_GIT_VERION_TAG_TO_SHARE`
      environments are set to the desired values!

      To share this Step into a StepLib you can just run: $ bitrise run share-this-step

      Once it finishes the only thing left is to actually create a Pull Request,
      the way described in the guide printed at the end of the process.
    before_run:
    - audit-this-step
    steps:
    - git::https://github.com/bitrise-steplib/steps-script.git@master:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            bitrise share start -c "${MY_STEPLIB_REPO_FORK_GIT_URL}"
            bitrise share create --stepid "${STEP_ID_IN_STEPLIB}" --tag "${STEP_GIT_VERION_TAG_TO_SHARE}" --git "${STEP_GIT_CLONE_URL}"
            bitrise share finish
